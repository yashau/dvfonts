# Download bundles: zips built by scripts/bundles.py and served from R2 at
# /downloads/<id>.zip. Each bundle picks families by id list and/or filters.
#
#   families   = explicit family ids
#   categories = include families in these categories
#   licenses   = include only these license labels
#   legacy     = false drops pre-Unicode fonts (remapped by dvfonts, or kept on Latin keys)
#   format     = "ttf" (desktop, default), "woff2" (self-hosting kit with fonts.css)
#                or "legacy" (see the legacy bundle)

[bundles.essentials]
name = "Essentials"
description = "The fonts Dhivehi documents actually use: ModFaruma and Faruma, MV Ilham, MV Faseyha, MV A Waheed (MV Eamaan XP), the Bismi font, MV Randhoo and Noto Sans Thaana. MV Boli, the other common one, comes with Windows."
families = ["modfaruma", "faruma", "mv-ilham", "mv-faseyha", "mv-a-waheed", "bismi", "mv-randhoo", "noto-sans-thaana"]

[bundles.full]
name = "Full suite"
description = "Every family in the catalogue."

[bundles.unicode-originals]
name = "Unicode originals"
description = "Everything except the pre-Unicode fonts dvfonts remapped (old A_ fonts and similar)."
legacy = false

[bundles.open-licensed]
name = "Openly licensed"
description = "Only fonts under an explicit open license (OFL or Creative Commons BY), safe to redistribute."
licenses = ["OFL-1.1", "CC BY"]

[bundles.modern]
name = "Modern"
description = "Geometric and sans-style Thaana families."
categories = ["modern"]

[bundles.official]
name = "Official"
description = "Text faces in the Faruma tradition, for documents: letters, notices, books and reports."
categories = ["official"]

[bundles.artistic]
name = "Artistic"
description = "Decorative and headline fonts: outlines, shadows, pixel and stylised Thaana."
categories = ["artistic"]

[bundles.handwriting]
name = "Handwriting"
description = "Casual, calligraphic and handwritten styles."
categories = ["handwriting"]

[bundles.novelty]
name = "Novelty"
description = "Experimental and constructed designs: pixel, geometric and other unusual takes on Thaana."
categories = ["novelty"]

[bundles.webfonts-essentials]
name = "Webfont kit (Essentials)"
description = "The Essentials as WOFF2 with a ready-made fonts.css, for self-hosting."
families = ["modfaruma", "faruma", "mv-ilham", "mv-faseyha", "mv-a-waheed", "bismi", "mv-randhoo", "noto-sans-thaana"]
format = "woff2"

[bundles.webfonts-full]
name = "Webfont kit (Full suite)"
description = "Every family as WOFF2 with a ready-made fonts.css, for self-hosting."
format = "woff2"

[bundles.legacy]
name = "Legacy"
description = "Every pre-Unicode font in the archive, exactly as published, with Thaana on Latin keys. Only for opening old documents: for new text, type in Unicode and use the fonts on this site. The converter turns old text into Unicode."
format = "legacy"
# Every file in sources/ without Unicode Thaana, byte for byte, except these.
# Nothing in this bundle is used anywhere else on the site.
skip = { "bismi.ttf" = "symbol font, in the catalogue", "a-nishan.ttf" = "a single emblem dingbat, not a text font", "aammu-h-thedhu.ttf" = "removed at the designer's request" }
