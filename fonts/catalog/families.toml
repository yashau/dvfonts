[families.bismi]
name = "Bismi"
unmodified = true
hidden = true
designer = "Hassan Hameed"
category = "symbols"
aliases = ["A_Bismillah", "ABismillah"]
notes = "Arabic calligraphy symbols (Bismillah, honorifics, Hijri months) on ASCII keys. Not a Thaana font, but widely used in the Maldives."
fonts = { 400 = "bismi.ttf" }

