# dvfonts catalogue — the single hand-curated source of truth.
#
# Each [families.<id>] is one family on the site. `fonts` maps a CSS weight to a
# file in sources/. Legacy (pre-Unicode, ASCII-slot) fonts are detected from
# scripts/legacy.py and remapped to Unicode Thaana at build time.
#
# category: modern | traditional | display | handwriting | mono | symbols
# aliases:  other names the same design circulates under (searchable on the site)
# copyright: display text for the site when the font's own notice is too garbled
#            to tidy automatically (scripts/copyright.py); the files keep the original

