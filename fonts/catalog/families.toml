fonts = { 400 = "bismi.ttf" }

# ─── Not published ───────────────────────────────────────────────────────────
# Files in sources/ that are deliberately left out, and why.
#
# Not in the repo at all (commercially licensed, so not redistributable):
#   MV Boli (Microsoft/Monotype, ships with Windows)
#   Faruma Arabic (bundles glyphs from Microsoft's Traditional Arabic)

