# fonts.mv catalogue — the single hand-curated source of truth.
#
# Each [families.<id>] is one family on the site. `fonts` maps a CSS weight to a
# file in sources/. Legacy (pre-Unicode, ASCII-slot) fonts are detected from
# scripts/legacy.py and remapped to Unicode Thaana at build time.
#
# category: official | modern | artistic | handwriting | novelty | symbols
# aliases:  other names the same design circulates under (searchable on the site)
# hidden:   true keeps a family off the browse page; it keeps its own page, downloads and bundles
#
# Pre-Unicode files that aren't remapped here (excluded below) ship only in the
# legacy bundle (bundles.toml), byte for byte.
# designer: display credit for the site when the font names nobody usable
# copyright: display text for the site when the font's own notice is too garbled
#            to tidy automatically (scripts/copyright.py); the files keep the original
# year:     release year, when the files' own dates mislead (a Latin base font's
#           copyright, a template's year); otherwise the build reads it from the files

# ─── Official (text faces for documents, in the Faruma tradition) ────────────

