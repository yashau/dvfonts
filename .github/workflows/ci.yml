name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default.
permissions:
  contents: read

# A newer push makes the older run pointless: cancel it, on main too.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise itself, pinned: mise-action downloads a recent release unless told
  # otherwise, and every tool in this pipeline runs through it. Same pin in all
  # three workflows; bump them together.
  PINNED_MISE_VERSION: '2026.10.17'
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Font pipeline: ruff, rebuild the library from fonts/sources, and fail if the
  # committed catalog data differs. The build is byte-reproducible, so a diff
  # means generated data was edited by hand or `mise run fonts` wasn't run.
  # The built binaries (which live in R2, not git) go to the web job for e2e.
  # ---------------------------------------------------------------------------
  fonts:
    name: fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.PINNED_MISE_VERSION }}

      - name: Install
        run: uv sync --project fonts --frozen

      - name: Lint (ruff)
        run: |
          uv run --project fonts ruff check fonts/scripts
          uv run --project fonts ruff format --check fonts/scripts

      # The build is byte-reproducible, so its output is fully determined by
      # these inputs. The committed catalog data is part of the key: editing it
      # by hand changes the key, forces a rebuild, and the check below catches it.
      - name: Restore built fonts
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fonts/build/r2
          key: fonts-r2-${{ hashFiles('fonts/**', 'packages/thaana/src/legacy-layouts.json', 'apps/web/src/lib/data/**') }}

      - name: Rebuild fonts and bundles
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd fonts
          uv run python scripts/build.py
          uv run python scripts/bundles.py

      - name: Committed catalog data matches the pipeline
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if ! git diff --exit-code --stat -- apps/web/src/lib/data; then
            echo "::error::apps/web/src/lib/data is stale. Run 'mise run fonts && mise run bundles' and commit the result."
            exit 1
          fi

      - name: Fonts unchanged
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Font inputs unchanged; reused the cached build (rebuild and data check skipped)."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r2-static
          path: fonts/build/r2
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Packages + site: lint, unit tests, type-check, production build, then e2e
  # against the real Worker (wrangler dev) with the fonts loaded into local R2.
  # ---------------------------------------------------------------------------
  web:
    name: web
    needs: fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.PINNED_MISE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint + oxfmt)
        run: pnpm lint

      - name: Unit tests (packages)
        run: pnpm test

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Package lint (publint)
        run: pnpm --filter '@yashau/*' exec publint

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r2-static
          path: fonts/build/r2

      - name: Load fonts into local R2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          base = pathlib.Path("fonts/build/r2").resolve()
          entries = [{"key": p.relative_to(base).as_posix(), "file": str(p)} for p in sorted(base.rglob("*")) if p.is_file()]
          pathlib.Path("fonts/build/r2-bulk.json").write_text(json.dumps(entries))
          print(len(entries), "objects")
          PY
          cd apps/web
          pnpm exec wrangler r2 bulk put dvfonts-static --filename ../../fonts/build/r2-bulk.json --local --force

      # No browser install: Playwright drives the Google Chrome that GitHub's
      # ubuntu-24.04 image already has (channel: 'chrome' in playwright.config.ts).
      - name: End-to-end tests
        timeout-minutes: 8
        run: |
          google-chrome --version
          pnpm --filter @dvfonts/web run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: apps/web/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Single required check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fonts, web]
    runs-on: ubuntu-24.04
    steps:
      - env:
          FONTS: ${{ needs.fonts.result }}
          WEB: ${{ needs.web.result }}
        run: '[ "$FONTS" = success ] && [ "$WEB" = success ]'
