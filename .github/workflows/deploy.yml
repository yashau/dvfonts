name: Deploy site

# Pushing a site-vYYYY.MMDD.N tag (`mise run release:site`) is the only way the
# site ships, so every deployed state has a version and an author.
on:
  push:
    tags:
      - 'site-v*'

permissions:
  contents: read

# Serialise deploys and never cancel one: killing `wrangler deploy` between the
# asset manifest and the asset upload publishes a broken version.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  PINNED_MISE_VERSION: '2026.10.17'
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://dvfonts.yashau.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          # This job holds Cloudflare credentials: no cache in either direction,
          # so a lower-privilege run can't poison what gets deployed.
          cache: false

      - name: Validate tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#site-v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::${REF_NAME} is not a site-vYYYY.MMDD.N tag."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      # The font build is byte-reproducible from its inputs, so fingerprint the
      # inputs (git blob hashes) and compare with the fingerprint stored in R2 by
      # the last upload. Unchanged: skip the font build and the upload entirely.
      # To force a re-upload, delete the `.fingerprint` object from the bucket.
      - name: Have the fonts changed since the last upload?
        id: fonts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          # First deploy: create the bucket (no-op if it already exists).
          pnpm exec wrangler r2 bucket create dvfonts-static 2>&1 | tail -1 || true
          local_fp="$(git ls-files -s -- ../../fonts ../../packages/thaana/src/legacy-layouts.json | sha256sum | cut -d' ' -f1)"
          remote_fp="$(pnpm exec wrangler r2 object get dvfonts-static/.fingerprint --remote --pipe 2>/dev/null || true)"
          echo "local:  ${local_fp}"
          echo "remote: ${remote_fp:-<none>}"
          echo "fingerprint=${local_fp}" >> "$GITHUB_OUTPUT"
          if [ "$local_fp" = "$remote_fp" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fonts unchanged since the last upload; skipping font build and R2 upload."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fonts and bundles (binaries go to R2, data must match git)
        if: steps.fonts.outputs.changed == 'true'
        run: |
          set -euo pipefail
          uv sync --project fonts --frozen
          cd fonts
          uv run python scripts/build.py
          uv run python scripts/bundles.py
          uv run python scripts/r2_manifest.py
          cd ..
          if ! git diff --exit-code --stat -- apps/web/src/lib/data; then
            echo "::error::Committed catalog data doesn't match the pipeline; refusing to deploy."
            exit 1
          fi

      - name: Upload fonts and bundles to R2
        if: steps.fonts.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINGERPRINT: ${{ steps.fonts.outputs.fingerprint }}
        working-directory: apps/web
        # Uploaded BEFORE the Worker deploy, so the new site never references a
        # file that isn't there yet. The fingerprint is written last: if any
        # upload fails, the next deploy sees a mismatch and uploads again.
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 bulk put dvfonts-static --filename ../../fonts/build/r2-bulk.json --remote --force
          printf '%s' "$FINGERPRINT" > "$RUNNER_TEMP/fingerprint"
          pnpm exec wrangler r2 object put dvfonts-static/.fingerprint --file "$RUNNER_TEMP/fingerprint" --content-type text/plain --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        working-directory: apps/web
        run: pnpm exec wrangler deploy --tag "$REF_NAME" --message "$REF_NAME"

      - name: Smoke-test production
        run: |
          set -euo pipefail
          base=https://dvfonts.yashau.com
          for path in / /fonts/faruma /docs /llms.txt /fonts.json /thaana.js "/css2?family=Faruma" /fonts/faruma/faruma-400.thaana.woff2 /downloads; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}")"
            echo "${code} ${path}"
            [ "$code" = 200 ]
          done
          first="$(jq -r '.[0].file' apps/web/src/lib/data/bundles.json)"
          curl -sfI "${base}/fonts/faruma/faruma.zip" | grep -i '^content-type: application/zip'
          curl -sfI "${base}/downloads/${first}" | grep -i '^content-type: application/zip'

      - name: Summary
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          FONTS_CHANGED: ${{ steps.fonts.outputs.changed }}
        run: |
          {
            echo "### Site ${REF_NAME#site-v} deployed"
            echo
            echo "- commit: \`${COMMIT}\`"
            echo "- fonts uploaded to R2: ${FONTS_CHANGED}"
            echo "- url: https://dvfonts.yashau.com"
          } >> "$GITHUB_STEP_SUMMARY"
