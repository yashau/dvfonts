name: Preview

# Label a PR `preview` to deploy it to https://br-dvfonts.yashau.com, a separate
# Worker (wrangler env "preview"). Later pushes to the PR redeploy it. Only PRs
# from this repository get the credentials. The preview reads the production
# R2 bucket and never uploads to it, so fonts or zips the PR adds or renames
# aren't there until a real release.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# One preview at a time, and never cancel a deploy halfway.
concurrency:
  group: deploy-preview
  cancel-in-progress: false

env:
  PINNED_MISE_VERSION: '2026.10.17'
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: preview
    if: contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: preview
      url: https://br-dvfonts.yashau.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          # This job holds Cloudflare credentials: no cache in either direction.
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: 'PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}'
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env preview --message "$MESSAGE"

      - name: Smoke-test preview
        run: |
          set -euo pipefail
          base=https://br-dvfonts.yashau.com
          # A new custom domain can take a minute to resolve on the first deploy.
          curl -s -o /dev/null --retry 12 --retry-delay 10 --retry-all-errors -f "${base}/"
          for path in / /fonts/faruma /docs "/css2?family=Faruma"; do
            code="$(curl -s -o /dev/null --retry 3 --retry-all-errors -w '%{http_code}' "${base}${path}")"
            echo "${code} ${path}"
            [ "$code" = 200 ]
          done

      - name: Summary
        env:
          PR: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### PR #${PR} previewed"
            echo
            echo "- commit: \`${COMMIT}\`"
            echo "- url: https://br-dvfonts.yashau.com"
          } >> "$GITHUB_STEP_SUMMARY"
